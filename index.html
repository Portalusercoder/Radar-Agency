<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>رادار | وكالة تسويق رقمية للسوق السعودي</title>
    <meta
      name="description"
      content="وكالة رادار تدير حملاتك على سناب شات وتيك توك وقوقل، وتربطها بمتجرك على سلة أو زد. تقارير شهرية بالريال السعودي."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+Arabic:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <style>
      html.is-loading,
      html.is-loading body {
        overflow: hidden;
      }

      html.is-loading #root {
        pointer-events: none;
      }

      html.loader-skip #site-loader {
        display: none;
      }

      #site-loader {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: grid;
        place-items: center;
        background: #f4f1ec;
        color: #14161c;
        transition: opacity 520ms ease, visibility 520ms ease;
      }

      #site-loader.is-leaving {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      .loader-mark {
        width: 6.8rem;
        height: auto;
        overflow: visible;
      }

      .loader-mark path,
      .loader-mark rect {
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-width: 28;
      }
    </style>
    <script>
      try {
        var en = localStorage.getItem("radar-locale") === "en";
        document.documentElement.lang = en ? "en" : "ar";
        document.documentElement.dir = en ? "ltr" : "rtl";
        if (en) document.title = "Radar | Digital marketing for the Saudi market";
        if (sessionStorage.getItem("radar-seen") === "1") {
          document.documentElement.classList.add("loader-skip");
        } else {
          document.documentElement.classList.add("is-loading");
        }
      } catch (e) {
        document.documentElement.classList.add("is-loading");
      }
    </script>
  </head>
  <body>
    <div
      id="site-loader"
      role="status"
      aria-live="polite"
      aria-busy="true"
      aria-label="رادار"
    >
      <svg class="loader-mark" viewBox="0 0 900.07 319" fill="none" aria-hidden="true">
        <path data-fill="#fd8256" d="M83.43,33.37h0a31.34,31.34,0,0,0,8.17,31.5c30.31,29.05,42.47,72.58,30.44,112-12.74,41.8-50.4,71.87-94.28,77A31.39,31.39,0,0,0,.06,284.23L0,286a31.45,31.45,0,0,0,34.87,32.17c67.34-7.59,127-54.43,147.4-123.4a173.93,173.93,0,0,0-47-175.25A31.47,31.47,0,0,0,83.43,33.37Z"/>

        <path data-fill="#fd8256" d="M794.06,33.37h0a31.32,31.32,0,0,0,8.18,31.5c30.31,29.05,42.46,72.58,30.43,112-12.73,41.8-50.4,71.87-94.27,77a31.41,31.41,0,0,0-27.71,30.36l0,1.74a31.44,31.44,0,0,0,34.86,32.17c67.34-7.59,127-54.43,147.4-123.4a173.9,173.9,0,0,0-47-175.25A31.47,31.47,0,0,0,794.06,33.37Z"/>
      </svg>
    </div>
    <script>
      (function () {
        var loader = document.getElementById("site-loader");
        if (!loader) return;
        loader.setAttribute(
          "aria-label",
          document.documentElement.lang === "en" ? "Loading Radar" : "جاري تحميل رادار",
        );
        var reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        var letters = Array.prototype.slice.call(
          loader.querySelectorAll(".loader-mark path, .loader-mark rect"),
        ).reverse();
        var ease = "0.45s cubic-bezier(0.22, 1, 0.36, 1)";
        letters.forEach(function (letter, index) {
          var color = letter.getAttribute("data-fill");
          var length = letter.getTotalLength();
          letter.style.stroke = color;
          letter.style.strokeDasharray = String(length);
          letter.style.strokeDashoffset = String(length);
          letter.style.fill = "transparent";
          if (reduced) {
            letter.style.strokeDashoffset = "0";
            letter.style.fill = color;
            letter.style.stroke = "none";
            return;
          }
          window.setTimeout(function () {
            letter.style.transition = "stroke-dashoffset " + ease;
            letter.style.strokeDashoffset = "0";
          }, 180 + index * 240);
          window.setTimeout(function () {
            letter.style.transition = "fill 0.28s ease, stroke-width 0.28s ease";
            letter.style.fill = color;
            letter.style.strokeWidth = "0";
          }, 180 + index * 240 + 400);
        });
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
